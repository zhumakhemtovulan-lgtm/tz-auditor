# Q-12 (Высокий): Учитываются ли в накопленных расходах комиссии банка за обслуживание, отмены авторизаций (reversal) и квази-кэш операции, помимо стандартных проведённых покупок (п. Ф-2)?
#   а) Учитываются только проведённые покупки (POS/E-commerce); комиссии и отмены авторизаций не влияют на расходы
#   б) Отмена авторизации уменьшает расходы месяца исходной покупки, комиссии и квази-кэш не учитываются
#   в) Все списания по карте (включая комиссии и квази-кэш) входят в расходы
#   г) другое: уточнить
Q-12: "а) Учитываются только проведённые покупки (в магазине и в интернете). Комиссии банка и квази-наличные операции не учитываются; отмена авторизации на расходы не влияет, так как учитываются только проведённые операции."

# Q-13 (Высокий): Уменьшает ли частичный возврат накопленную сумму расходов пропорционально сумме возврата и сбрасывается ли признак отправки push для повторного срабатывания при следующем превышении порога в том же месяце (п. Ф-2, Ф-3)?
#   а) Частичный возврат уменьшает расходы на сумму возврата; сброс push не происходит (повторный push в этом месяце не отправляется)
#   б) Частичный возврат уменьшает расходы; если сумма опустилась ниже порога, признак сбрасывается и при повторном превышении отправляется push
#   в) Частичные возвраты не уменьшают накопленные расходы
#   г) другое: уточнить
Q-13: "а) Частичный возврат уменьшает расходы месяца исходной покупки на сумму возврата; признак отправки не сбрасывается, повторный push в этом месяце не отправляется (как и в ответе на Q-03)."

# Q-14 (Высокий): Отправляется ли push-уведомление немедленно при сохранении нового порога, если текущая накопленная сумма за месяц уже равна или превышает вновь установленный порог, или push высылается только при совершении следующей покупки (п. Ф-4)?
#   а) Push отправляется немедленно в момент успешного сохранения настройки в API
#   б) Push не отправляется при сохранении настройки, а ожидает поступления следующей покупки
#   в) другое: уточнить
Q-14: "а) Если при сохранении нового порога накопленная сумма уже равна ему или выше, push отправляется сразу после успешного сохранения; это и есть единственный push для этого порога в текущем месяце."

# Q-15 (Средний): Где будут зафиксированы URL Prod-окружения для метода `/alerts/saveLimit` и ссылка на спецификацию Swagger (раздел REST API, Общие параметры)?
#   а) Добавить спецификацию Swagger и Prod URL в актуальную версию документации
#   б) Использовать относительные пути (базовый URL задаётся через переменные окружения, Swagger будет предоставлен отдельным файлом)
#   в) другое: уточнить
Q-15: "а) Prod URL и ссылка на Swagger добавляются в документацию до передачи в разработку."

# Q-16 (Низкий): Планируется ли заполнение блока согласующих лиц, версионирования документа и результатов прохождения чек-листа ревью требований (раздел «Блок согласующих», п. «Ревью требований»)?
#   а) Документ будет дополнен авторами и пройден по чек-листу перед передачей в релиз
#   б) Для данного учебного/пилотного контекста заполнение формального блока согласующих не требуется
#   в) другое: уточнить
Q-16: "а) До передачи в разработку документ дополняется: версия, автор, согласующие, заполненный чек-лист ревью, раздел тестирования, а также критерии приёмки для Ф-1 (границы 1 000 и 1 000 000 ₸ включительно, по умолчанию уведомление выключено) и для Ф-4 (смена порога с сохранением накопленной суммы)."

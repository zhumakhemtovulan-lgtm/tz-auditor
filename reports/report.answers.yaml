# Q-01 (Высокий): К какому месяцу относить сумму операции, если покупка совершена 31 января в 23:58 по Алматы, но проведена по счету 1 февраля в 00:03 (п. Ф-2 указывает на дату совершения, а Критерий приёмки №2 — на дату проведения)?
#   а) К январю (по дате совершения операции)
#   б) К февралю (по дате проведения операции по счету)
#   в) Другое (уточнить правило)
Q-01: "б) К февралю, по дате проведения операции по времени Алматы. В расходы входят только проведённые операции, поэтому и месяц определяется датой проведения. Критерий приёмки №2 верный, формулировку Ф-2 нужно исправить."

# Q-02 (Высокий): Отправляется ли push-уведомление при изменении порога в текущем месяце, если клиенту уже высылался push в этом месяце (п. Ф-3 говорит «максимум один push за календарный месяц», а п. Ф-4 — «push отправляется независимо от истории предыдущей настройки»)?
#   а) Да, если после смены порога накопительная сумма снова его достигла/превысила
#   б) Нет, строго не более 1 push за календарный месяц на одну карту
#   в) Другое
Q-02: "а) Да. После изменения порога признак отправки сбрасывается: если накопленная сумма снова достигла нового порога в том же месяце, клиент получает push. Ф-3 уточнить: не более одного push на один порог в календарном месяце."

# Q-03 (Высокий): Как сервис должен обрабатывать возврат по покупке прошлого месяца или ситуацию, когда событие возврата поступает в сервис раньше события первичной покупки (п. Ф-2)?
#   а) Уменьшать расходы текущего (активного) месяца
#   б) Пересчитывать расходы прошлого месяца без повторной отправки push
#   в) Игнорировать возвраты прошлых периодов
#   г) Другое
Q-03: "б) Возврат уменьшает расходы месяца исходной покупки; уже отправленный push не отзывается и повторно не отправляется. Если событие возврата пришло раньше покупки, возврат сохраняется и учитывается при поступлении покупки (связь по идентификатору исходной операции)."

# Q-04 (Высокий): Каким HTTP-методом и в каком формате должно выполняться сохранение настроек порога в API `/alerts/saveLimit` (раздел REST API, Общие параметры)?
#   а) Перевести метод на POST/PUT с передачей cardId, amount, enabled в JSON-теле запроса
#   б) Оставить GET с Query-параметрами
#   в) Другое
Q-04: "а) Метод сохранения — POST, параметры cardId, amount, enabled передаются в JSON-теле запроса."

# Q-05 (Высокий): Какой HTTP-код состояния должен возвращать метод `/alerts/saveLimit` при некорректной сумме и при попытке доступа к чужой или отсутствующей карте (раздел REST API, Статусы)?
#   а) 400 Bad Request при ошибке суммы и 404 Not Found (или 403 Forbidden) для чужой карты
#   б) 200 OK с результатом ERROR при ошибке суммы и 404 для чужой карты
#   в) Другое
Q-05: "а) 400 Bad Request при некорректной сумме; 404 Not Found для чужой или несуществующей карты, раздел про 403 удалить. Ошибка не возвращается с кодом 200."

# Q-06 (Средний): Какое правило конвертации применяется при суммировании операций, хранящихся в тиынах, с порогом, заданным в тенге (п. Ф-1 и раздел «Требования к данным»)?
#   а) Сумма операции в тиынах делится на 100 перед суммированием и сравнением
#   б) Порог конвертируется в тиыны (умножается на 100) при сохранении
#   в) Другое
Q-06: "б) Все суммы хранятся и сравниваются в тиынах: порог при сохранении умножается на 100. Округления не применяются."

# Q-07 (Средний): По какому курсу и на какой момент пересчитывать операции в иностранной валюте по KZT-карте и приводится ли локальное время транзакции к часовому поясу Алматы (п. Ф-1, Ф-2)?
#   а) Пересчитывать по курсу банка на момент совершения покупки, приводить время к UTC+5 (Алматы)
#   б) Пересчитывать по курсу на момент проведения операции по счету
#   в) Игнорировать валютные операции
#   г) Другое
Q-07: "в) Учитывается сумма, фактически списанная со счёта карты в тенге при проведении операции; время операции приводится к часовому поясу Алматы."

# Q-08 (Средний): По какому уникальному ключу определяется повторная доставка события процессинга и как возврат связывается с исходной операцией (п. «Требования к данным», «Требования к интеграции»)?
#   а) Поле transaction_id для идемпотентности и parent_transaction_id для возврата
#   б) Поле event_id от процессинга
#   в) Другое
Q-08: "а) Ключ идемпотентности — идентификатор операции процессинга; для возврата хранится идентификатор исходной операции (добавить поле в требования к данным)."

# Q-09 (Средний): Каковы целевой перцентиль и профиль нагрузки для требования доставки push «в течение одной минуты» (раздел «Нефункциональные требования»)?
#   а) 99% транзакций при нагрузке до 500 RPS
#   б) 95% транзакций без ограничений по RPS
#   в) Другое
Q-09: "в) 95% событий — не более 60 секунд, 99% — не более 120 секунд от получения события сервисом расходов до передачи в сервис push, при пиковой дневной нагрузке."

# Q-10 (Средний): В каком типе данных должны передаваться и возвращаться параметры amount и enabled в REST API (раздел REST API, Параметры запроса / Ответ)?
#   а) Тип integer в запросе и в ответе
#   б) Тип string в запросе и в ответе
#   в) amount — integer, enabled — boolean
#   г) Другое
Q-10: "в) amount — целое число (integer), enabled — логическое значение (boolean), одинаково в запросе и в ответе."

# Q-11 (Низкий): Какая схема отката или скрытия функционала предусмотрена в случае сбоев сервиса расчёта лимитов (раздел «Ревью требований», п. 5)?
#   а) Дистанционное скрытие настройки в UI с помощью Feature Toggle
#   б) Отключение обработки событий на стороне сервиса уведомлений
#   в) Другое
Q-11: "а) Feature toggle: функция скрывается в интерфейсе и отправка push останавливается без выпуска новой версии приложения."
